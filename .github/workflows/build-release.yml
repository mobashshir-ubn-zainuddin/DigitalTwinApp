name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build output
        run: Get-ChildItem dist -Recurse | Select-Object Name, Length
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: dist/*.exe
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Room Digital Twin ${{ github.ref_name }}
          files: dist/*.exe
          body: |
            ## Room Digital Twin ${{ github.ref_name }}

            ### Download Options

            | File | Use |
            |------|-----|
            | `*Setup*.exe` | Installer - adds desktop shortcut, uninstaller included |
            | `*Portable*.exe` | No install needed - download and run directly |

            ### Windows SmartScreen Notice
            Windows may show "Windows protected your PC" on first launch because the EXE is unsigned.
            Click **More info** then **Run anyway** to proceed.

            ### What's included
            - 3D room simulation with Three.js (computers, AC, fan, people)
            - Indoor first-person view + outdoor orbit view
            - Real-time physics: temperature, humidity, CO2, O2, luminosity
            - All parameters editable while simulation is running
            - 5 live sparkline telemetry charts
            - Fan auto-mode and AC hysteresis control
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
