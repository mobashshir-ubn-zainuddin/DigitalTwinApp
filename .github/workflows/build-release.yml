name: Build & Release Windows EXE

# Triggers:
#   - Push a tag like v1.0.0  -> builds + creates a GitHub Release with EXEs attached
#   - workflow_dispatch       -> builds manually from the GitHub Actions UI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List dist output
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length
        shell: pwsh

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: RoomDigitalTwin-Installer-Windows-x64
          path: dist/*Setup*.exe
          if-no-files-found: warn

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: RoomDigitalTwin-Portable-Windows-x64
          path: dist/*Portable*.exe
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Room Digital Twin ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Room Digital Twin ${{ github.ref_name }}

            ### Download

            | File | Description |
            |------|-------------|
            | `*-Setup-*.exe` | **Installer** - installs to Program Files, adds desktop shortcut |
            | `*-Portable.exe` | **Portable** - run directly, no installation needed |

            ### First Run (Windows SmartScreen)
            Because the EXE is unsigned, Windows may show "Windows protected your PC".
            Click **More info -> Run anyway** to proceed.

            ### Features
            - Interactive 3D room simulation (Three.js)
            - Indoor / Outdoor camera views with auto-rotating outside orbit
            - Real-time physics: temperature, humidity, CO2, O2, luminosity
            - Live-editable parameters while simulation runs (AC, fan, occupancy, lighting, PCs)
            - Sparkline telemetry charts
            - Fan auto-mode (CO2-driven RPM adjustment)
          files: |
            dist/*Setup*.exe
            dist/*Portable*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
