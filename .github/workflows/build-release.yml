name: Build & Release Windows EXE

# Triggers:
#   - Push a tag like v1.0.0  → builds + creates a GitHub Release with EXEs attached
#   - workflow_dispatch       → builds manually from the GitHub Actions UI (no release created)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the built EXEs?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies (electron + electron-builder)
      - name: Install dependencies
        run: npm ci

      # 4. Build the Windows installer + portable EXE
      - name: Build Windows EXE
        run: npm run build:win
        env:
          # Skips code-signing (no certificate needed for personal use).
          # Windows SmartScreen will show a warning on first run; users click "More info → Run anyway".
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 5. List what was built (for debugging)
      - name: List dist output
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length
        shell: pwsh

      # 6. Upload both EXEs as workflow artifacts (always available, even without a release)
      - name: Upload installer EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomDigitalTwin-Installer-Windows-x64
          path: dist/*Setup*.exe
          if-no-files-found: warn

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomDigitalTwin-Portable-Windows-x64
          path: dist/*Portable*.exe
          if-no-files-found: warn

      # 7. Create a GitHub Release and attach both EXEs (only on tag push or manual opt-in)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Room Digital Twin {0}', github.ref_name) || format('Room Digital Twin Manual Build #{0}', github.run_number) }}
          body: |
            ## Room Digital Twin — Desktop App

            ### Download
            | File | Description |
            |------|-------------|
            | `*-Setup-*.exe` | **Installer** — installs to Program Files, adds desktop shortcut |
            | `*-Portable.exe` | **Portable** — run directly, no installation needed |

            ### First Run (Windows SmartScreen)
            Because the EXE is unsigned, Windows may show *"Windows protected your PC"*.
            Click **More info → Run anyway** to proceed.

            ### Features
            - Interactive 3D room simulation (Three.js)
            - Indoor / Outdoor camera views with auto-rotating outside orbit
            - Real-time physics: temperature, humidity, CO₂, O₂, luminosity
            - Live-editable parameters while simulation runs (AC, fan, occupancy, lighting, PCs)
            - Sparkline telemetry charts
            - Fan auto-mode (CO₂-driven RPM adjustment)
          files: |
            dist/*Setup*.exe
            dist/*Portable*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
