name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build output
        run: Get-ChildItem dist -Recurse | Select-Object Name, Length
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Room-Digital-Twin-Setup-x64
          path: dist/Room-Digital-Twin-Setup-x64.exe
          if-no-files-found: warn

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Room-Digital-Twin-Portable
          path: dist/Room-Digital-Twin-Portable.exe
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Room Digital Twin ${{ github.ref_name }}
          files: |
            dist/Room-Digital-Twin-Setup-x64.exe
            dist/Room-Digital-Twin-Portable.exe
          body: |
            ## Room Digital Twin ${{ github.ref_name }}

            ### Download

            | File | Description | Link |
            |------|-------------|------|
            | Installer (recommended) | Installs to Program Files, adds desktop & Start Menu shortcut, includes uninstaller | [Room-Digital-Twin-Setup-x64.exe](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Room-Digital-Twin-Setup-x64.exe) |
            | Portable | No installation - download and double-click to run | [Room-Digital-Twin-Portable.exe](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Room-Digital-Twin-Portable.exe) |

            ### Windows SmartScreen Notice
            Windows may show "Windows protected your PC" on first launch because the EXE is unsigned.
            Click **More info** then **Run anyway** to proceed. This is normal for open-source apps without a paid code-signing certificate.

            ### What's in this release
            - 3D room simulation (Three.js) with workstations, AC unit, exhaust fan, ceiling LEDs, occupant avatars
            - Indoor first-person view + outdoor auto-rotating orbit view
            - Real-time physics engine: temperature, humidity, CO2, O2, luminosity
            - All parameters editable live while simulation runs (no restart needed)
            - 5 sparkline telemetry charts with rolling history
            - Fan auto-mode: RPM adjusts automatically based on CO2 level
            - AC hysteresis control with on/off status indicator
            - Simulation speed: 1x to 1000x time acceleration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
